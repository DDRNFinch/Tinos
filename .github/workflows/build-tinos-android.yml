name: Build Tinos Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Tinos
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Prepare bundled Tinos web app
        run: npm run native:prepare

      - name: Create Android project
        run: npx cap add android

      - name: Sync Tinos into Android
        run: npx cap sync android

      - name: Apply Tinos launcher icon
        run: |
          python -m pip install --quiet pillow
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          scale = 4
          size = 512
          canvas = Image.new('RGBA', (size * scale, size * scale), (0, 0, 0, 0))
          draw = ImageDraw.Draw(canvas)

          orange = '#e7a15f'
          white = '#ffffff'
          S = scale

          draw.rounded_rectangle(
              (0, 0, size*S-1, size*S-1),
              radius=112*S,
              fill=orange
          )
          draw.ellipse(
              ((98*S, 98*S), (414*S, 414*S)),
              outline=white,
              width=13*S
          )
          draw.ellipse(
              ((190*S, 220*S), (250*S, 280*S)),
              outline=white,
              width=10*S
          )
          draw.ellipse(
              ((262*S, 220*S), (322*S, 280*S)),
              outline=white,
              width=10*S
          )

          source = canvas.resize((size, size), Image.Resampling.LANCZOS)
          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }
          base = Path('android/app/src/main/res')
          for folder, target_size in sizes.items():
              target = base / folder
              target.mkdir(parents=True, exist_ok=True)
              icon = source.resize((target_size, target_size), Image.Resampling.LANCZOS)
              icon.save(target / 'ic_launcher.png')
              icon.save(target / 'ic_launcher_round.png')

          adaptive = base / 'mipmap-anydpi-v26'
          for name in ('ic_launcher.xml', 'ic_launcher_round.xml'):
              path = adaptive / name
              if path.exists():
                  path.unlink()
          PY

      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Tinos APK
        uses: actions/upload-artifact@v4
        with:
          name: Tinos-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
