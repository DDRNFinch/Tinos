name: Build Tinos Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Tinos
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Prepare bundled Tinos web app
        run: npm run native:prepare

      - name: Create Android project
        run: npx cap add android

      - name: Sync Tinos into Android
        run: npx cap sync android

      - name: Apply Tinos launcher icon
        run: |
          python -m pip install --quiet pillow
          python <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Image.open('tinos-512.png').convert('RGBA')
          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }
          base = Path('android/app/src/main/res')
          for folder, size in sizes.items():
              target = base / folder
              target.mkdir(parents=True, exist_ok=True)
              icon = source.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(target / 'ic_launcher.png')
              icon.save(target / 'ic_launcher_round.png')

          adaptive = base / 'mipmap-anydpi-v26'
          for name in ('ic_launcher.xml', 'ic_launcher_round.xml'):
              path = adaptive / name
              if path.exists():
                  path.unlink()
          PY

      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Tinos APK
        uses: actions/upload-artifact@v4
        with:
          name: Tinos-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
